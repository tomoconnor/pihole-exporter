name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race matters here: the fix this fork exists for is a concurrency bug.
      - name: go test
        run: go test -race -cover ./...

  image:
    name: container image (linux/amd64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only on branches; publishing happens in release.yml on a tag.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pihole-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm -d --name exporter -p 9617:9617 \
            -e PIHOLE_HOSTNAME=127.0.0.1 \
            -e PIHOLE_PASSWORD=nonsense \
            pihole-exporter:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9617/liveness >/dev/null; then
              echo "exporter is live"
              docker rm -f exporter
              exit 0
            fi
            sleep 1
          done
          echo "exporter never became live"
          docker logs exporter
          docker rm -f exporter
          exit 1
